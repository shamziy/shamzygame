  D.req.filter(r => r.status === "pending" && U(r.to).bot && r.at < t - 3500).forEach(r => { r.status = hnum(r.id) % 100 < (r.pct >= 50 ? 85 : 55) ? "accepted" : "declined"; });
  D.users.filter(x => !x.bot).forEach(h => bots.forEach(bt => { const ms = between(h.id, bt.id), l = ms[ms.length - 1]; if (l && l.from === h.id && l.at < t - 1500 && friends(h.id, bt.id)) D.msg.push({ id: nid(), from: bt.id, to: h.id, text: pick(BR), at: t }); }));
  D.games.forEach(g => { const bB = U(g.b); if (g.status === "invited" && bB.bot && g.at < t - 2500) { if (hnum(g.id) % 100 < 75) startGame(g); else g.status = "declined"; }
    else if (g.status === "playing" && Math.random() < 0.5) { const asker = g.i % 2 === 0 ? g.a : g.b, ans = asker === g.a ? g.b : g.a; if (U(asker).bot && !g.asked) g.asked = 1; else if (U(ans).bot && g.asked) answer(g, ans, pick(BA)); } });
  if (humans.length && Math.random() < 0.02) { const h = pick(humans), bt = pick(bots), pct = compat(bt, h); if (pct > 20 && !rel(bt.id, h.id) && !blocked(bt.id, h.id)) D.req.push({ id: nid(), from: bt.id, to: h.id, status: "pending", pct, at: t }); }
  if (humans.length && Math.random() < 0.03) { const h = pick(humans), bt = pick(bots); D.views = D.views.filter(v => !(v.v === bt.id && v.to === h.id)); D.views.push({ v: bt.id, to: h.id, at: t }); }
  save(); } catch (e) {} }
const demoFetch = async (url, o = {}) => { const [p, qs] = String(url).slice(4).split("?"); let b = {}; try { b = o.body ? JSON.parse(o.body) : {}; } catch (e) {}
  const [c, j] = route(o.method || "GET", p, new URLSearchParams(qs || ""), b, ((o.headers || {}).Authorization || "").replace("Bearer ", "")); save();
  return new Response(JSON.stringify(j), { status: c, headers: { "Content-Type": "application/json" } }); };
const real = globalThis.fetch.bind(globalThis);
const alive = async b => { try { const r = await real(b + "/health"); const j = await r.json(); return r.ok && !!j && j.ok === true; } catch (e) { return false; } };
async function decide() { // returns the backend address ("" = same address) or null = no backend, use demo mode
  if (globalThis.LIL_DEMO) return null;
  const cfg = globalThis.LIL_API;
  const local = location.protocol === "file:" || ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname); // only hunt for a backend on this computer when the page is on this computer
  for (const b of typeof cfg === "string" ? [cfg.replace(/\/$/, "")] : location.protocol === "file:" ? ["http://localhost:3000"] : local ? ["", "http://localhost:3000"] : [""]) if (await alive(b)) return b;
  return null; }
function demoOn() { setInterval(tick, 1500); const e = document.createElement("div"); e.textContent = globalThis.LIL_DEMO ? "Preview · demo people" : "Demo mode · no server found"; e.style.cssText = "position:fixed;left:8px;bottom:76px;z-index:40;background:#3b2a3a;color:#fff;font:700 11px system-ui,sans-serif;border-radius:99px;padding:4px 12px;opacity:.9;cursor:pointer";
  e.onclick = () => globalThis.LIL_DEMO ? alert("This is a preview with pretend people. Everything is saved only in this browser.") : alert("No backend server was found, so this is running in DEMO mode: pretend people, and everything is saved only in this browser.\n\nTo run the real app, start the backend (open the backend folder, run: node server.mjs) and reload this page."); document.body.appendChild(e); }
let ready = null;
globalThis.fetch = async (url, o) => { if (!String(url).startsWith("/api")) return real(url, o);
  if (!ready) ready = decide().then(b => { if (b === null) demoOn(); return b; });
  const base = await ready; return base === null ? demoFetch(url, o) : real(base + url, o); };
})();

function stats(){if(!me)return `<div class="bd">${ic(IC.sp)} Sign in to start your life in Lagos</div>`;regen();const s=st(),b=(e,n,v,k)=>`<div class="sb">${e} ${n}<i><u style="width:${v}%;background:${k}"></u></i></div>`;return `<div class="stats">${b("⚡","Energy",s.en,"#f4b942")}${b("😊","Mood",s.mo,"#dc5f84")}</div>`}

async function doMatch(id){if(!me)return openAuth("up",id);const p=UC[id];let r;try{r=await api("POST","/matches",{to:id})}catch(e){return toast(e.message)}const pc=r.pct,nm=esc(p.name);

function chList(q){if(q){return SR===null?'<p class="sub">Searching…</p>':SR.length?SR.map(u=>rowU(u,`<div class="jb">@${esc(u.username)}${u.area?" · "+esc(u.area):""}</div>`,`bio(${u.id})`)).join(""):'<p class="sub">No one found with that username.</p>'}
const ms=M.matches.slice().sort((a,b)=>((b.last&&b.last.created)||0)-((a.last&&a.last.created)||0));
return `<h3 class="sec" style="margin-top:4px">Match requests</h3>`+(M.incoming.length?M.incoming.map(x=>`<div class="row">${av(x.user,48)}<div><b>${esc(x.user.name)}</b><div class="jb">${x.pct}% match · wants to match</div></div><button class="mb y" onclick="incA(${x.requestId},${x.user.id},1)">Match</button><button class="mb" onclick="incA(${x.requestId},${x.user.id},0)">Not now</button></div>`).join(""):'<p class="note" style="text-align:left">No match requests yet.</p>')+`<h3 class="sec">Recent chats</h3>`+(ms.length||M.sent.length?"":'<p class="sub">No chats yet. Tap someone on the street and match.</p>')+ms.map(x=>`<button class="row" onclick="openChat(${x.user.id})">${face(x.user,48)}<div><b>${esc(x.user.name)}</b>${tgs(x)}<div class="jb">${x.last?esc(x.last.text):"Say hi 👋"}</div></div></button>`).join("")+M.sent.map(x=>`<div class="row">${av(x.user,48)}<div><b>${esc(x.user.name)}</b><div class="jb">Match sent · waiting…</div></div></div>`).join("")}
function chSearch(v){v=v.trim().toLowerCase();clearTimeout(sT);if(!v){SR=null;$("#cl").innerHTML=chList("");return}SR=null;$("#cl").innerHTML=chList(v);sT=setTimeout(async()=>{try{SR=await api("GET","/people?q="+encodeURIComponent(v))}catch(e){SR=[]}SR.forEach(u=>UC[u.id]=u);if($("#cs")&&$("#cs").value.trim().toLowerCase()===v)$("#cl").innerHTML=chList(v)},250)}
function chatV(){if(!me)return gate("chat");if(cur)return thread();return `<h2>Chats</h2><input id="cs" class="srch" placeholder="🔍 Search people by username" oninput="chSearch(this.value)"><div id="cl">${chList("")}</div>`}
function thread(){const u=UC[cur],mt=M.matches.find(x=>x.user.id===cur)||{};return `<div class="th"><button class="hb" onclick="cur=null;render();loadMatches()">${ic(IC.ar)}</button>${face(u,44)}<div style="flex:1"><b>${esc(u.name)}</b>${tgs(mt)}${mt.photoUnlocked?'<span class="tag">📸 Photos visible</span>':""}<div class="jb">@${esc(u.username)}</div></div><button class="hb" style="font-size:26px" onclick="invite(${cur})" aria-label="Play 20 Questions">🎲</button></div>${mt.photoUnlocked?'<div class="gq">📸 You\'ve exchanged 100 messages! Your profile pictures are now visible to each other.</div>':""}<div id="msgs"></div><div id="gp"></div><div class="cin"><input id="ci" placeholder="Say something kind…" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">${ic(IC.s)}</button></div>`}
async function openChat(id){closeM();tab="chat";cur=id;MSG=[];GM=null;render();await loadThread()}
async function loadThread(){if(!cur||!me)return;const id=cur;let ms,g;try{[ms,g]=await Promise.all([api("GET","/messages/"+id+"?after="+(MSG.length?MSG[MSG.length-1].id:0)),api("GET","/games/with/"+id)])}catch(e){if(e.status===403){toast("You can only chat with your matches");cur=null;render()}return}
if(id!==cur)return;const changed=ms.length||JSON.stringify(g)!==JSON.stringify(GM);MSG=MSG.concat(ms);GM=g;if(changed)drawThread()}
function drawThread(){const e=$("#msgs"),g=$("#gp");if(!e||!g||!cur)return;e.innerHTML=MSG.map(x=>`<div class="m ${x.from_id===me.id?"me":""}">${esc(x.text)}<small>${new Date(x.created).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</small></div>`).join("");g.innerHTML=gpHTML(UC[cur]);if($("main"))$("main").scrollTop=1e9}
// the 20 Questions game is played right inside the DM
const gpHTML=u=>{if(!GM||GM.status==="declined")return"";const n=esc(u.name),hist=(GM.history||[]).slice(-5).map(h=>`<div class="gq"><small>${h.asker===me.id?"You asked":n+" asked"}</small>${esc(QB[h.q]?QB[h.q][1]:"")}<div class="ans">${esc(h.answer||"")}</div></div>`).join("");
if(GM.status==="invited")return GM.inviter===me.id?`<div class="gq iv"><b>🎲 20 Questions</b><span>Waiting for ${n} to say yes or no…</span></div>`:`<div class="gq iv"><b>🎲 20 Questions</b><span>${n} wants to play. Are you in?</span><div class="two"><button class="btn" onclick="gResp(1)">Yes, let's play</button><button class="btn o" onclick="gResp(0)">No thanks</button></div></div>`;
if(GM.status==="done")return hist+'<div class="gq">🎉 That\'s all 20! You two know each other so much better now.</div>';
const c=GM.cur||{},q=c.q!=null&&QB[c.q]?QB[c.q]:null,hd=`Question ${GM.i+1} of 20${q?" · "+CAT[q[0]]:""}`;
return hist+(c.yourTurnToAsk&&q?`<div class="gq"><small>${hd} · your turn to ask</small>${esc(q[1])}<button class="btn" onclick="askIt()">Ask it 👉</button></div>`:c.yourTurnToAnswer&&q?`<div class="gq"><small>${hd} · ${n} asks</small>${esc(q[1])}<small>Type your answer below</small></div>`:`<div class="gq"><small>${hd}</small>${c.asker===me.id?`Waiting for ${n} to answer…`:`${n} is picking a question…`}</div>`)};
async function invite(id){if(!me)return openAuth("up");closeM();try{await api("POST","/games/invite",{userId:id})}catch(e){if(e.status!==409)return toast(e.message)}openChat(id)}
async function gResp(y){try{await api("POST","/games/"+GM.id+"/respond",{accept:!!y})}catch(e){toast(e.message)}loadThread()}
async function askIt(){try{await api("POST","/games/"+GM.id+"/ask",{})}catch(e){toast(e.message)}loadThread()}
async function send(){const i=$("#ci"),t=i.value.trim();if(!t)return;i.value="";const a=GM&&GM.status==="playing"&&GM.cur&&GM.cur.yourTurnToAnswer;try{await api("POST",a?"/games/"+GM.id+"/answer":"/messages/"+cur,{text:t})}catch(e){toast(e.message);i.value=t;return}await loadThread()}
// ---------- map ----------
function mapV(){return `<h2>Where to?</h2><p class="sub">Pick a spot in Lagos and see who's around.</p><div class="scn map"><svg viewBox="0 0 360 260"><rect width="360" height="260" fill="#efe3cc"/><path d="M0 190q60-30 130-10t140 10 90-20v90H0z" fill="#a8d5da"/><path d="M0 120q90 20 180-10t180 20" stroke="#fff" stroke-width="8" fill="none"/><path d="M110 0q20 90 60 150t30 110" stroke="#fff" stroke-width="6" fill="none"/><path d="M250 0q-10 80 20 140" stroke="#fff" stroke-width="5" fill="none"/><ellipse cx="60" cy="60" rx="36" ry="22" fill="#cfe3b4"/><ellipse cx="300" cy="150" rx="30" ry="18" fill="#cfe3b4"/></svg>${MP.map((m,i)=>`<button class="pin" style="left:${m[0]}%;top:${m[1]}%" onclick="pick(${i})">${ic(IC.pin,1)}<span>${SCN[i][0]}</span></button>`).join("")}</div><h2 style="margin:18px 0 8px">Popular spots</h2>`+VENUES.map(v=>`<button class="row" onclick="pick(${v[2]})"><div><b>${v[0]}</b><div class="jb">${v[1]} · ${SCN[v[2]][0]}</div></div>${ic(IC.ar)}</button>`).join("")}
// ---------- corner: one graphic, visitors = people who tapped your profile ----------
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const VS=[[50,84,42],[28,86,42],[72,86,42],[12,80,36],[88,80,36],[40,76,34],[62,76,34],[20,70,30],[80,70,30],[50,68,30],[8,60,28],[92,60,28]];
const visHTML=v=>v.slice(0,12).map((x,i)=>{const s=VS[i];return `<button class="vs" style="left:${s[0]}%;top:${s[1]}%;opacity:${i<4?1:i<8?.9:.75};z-index:${20-i}" onclick="bio(${x.user.id})">${av(x.user,s[2])}${i<3?`<span class="vn">${esc(x.user.name)}</span>`:""}</button>`}).join("");
async function loadVisitors(){if(!me)return;try{VIS=await api("GET","/visitors")}catch(e){return}VIS.forEach(x=>UC[x.user.id]=x.user);if(tab==="corner")render(1)}
function cornerV(){if(!me)return gate("see your corner");return `<h2>${esc(me.name)}'s Corner</h2><p class="sub">Your spot on the Lagos street.</p><div class="scn crn"><svg viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice">${cornerSvg(me.name+"'s Corner","#f6d9b3",0)}</svg>${visHTML(VIS)}</div><h3 class="sec">Visitors${VIS.length?` (${VIS.length})`:""}</h3><p class="note" style="text-align:left;margin:0 0 10px">Only people who tap on your profile show up here. Recent visitors stand at the front, older ones further back.</p>`+(VIS.length?VIS.map(x=>`<button class="row" onclick="bio(${x.user.id})">${av(x.user,48)}<div><b>${esc(x.user.name)}</b><div class="jb">Viewed your profile · ${ago(x.at)}</div></div></button>`).join(""):'<p class="sub">No visitors yet.</p>')}
// ---------- daily: your day on the app + questions and answers ----------
async function loadDaily(){if(!me)return;try{[DLY,ACTV,QAL]=await Promise.all([api("GET","/daily"),api("GET","/activity"),api("GET","/qa")])}catch(e){return}if(tab==="daily")render(1)}
function dailyV(){if(!me)return gate("play Lagos Daily");if(!DLY)return '<p class="sub">Loading…</p>';const d=DAILY[new Date().getDay()],y=DLY.answered,td=ACTV,
qa=[...DLY.history.map(h=>({q:h.q,a:h.answer,by:"You",ok:h.ok,r:h.correct,ts:Date.parse(h.day)})),...QAL.map(x=>({q:QB[x.questionId]?QB[x.questionId][1]:"",a:x.answer,by:x.answeredBy==="you"?"You":"@"+x.with,ts:x.at}))].sort((a,b)=>b.ts-a.ts).slice(0,12);
return `<div class="dh"><span>${d[0]}</span><div><h2>${esc(DLY.title)}</h2><div class="jb">${d[2]}</div></div></div><div class="stats"><div class="sb">🔥 Streak<b style="display:block;font-size:24px">${DLY.streak} day${DLY.streak===1?"":"s"}</b></div><div class="sb">✅ Today<b style="display:block;font-size:24px">${td.length} thing${td.length===1?"":"s"}</b></div></div><div class="card"><b>Daily question</b><h3>${esc(DLY.question)}</h3>${y?`<p class="sub">You said <b>${esc(y.answer)}</b> · ${y.ok?"✅ Correct":"❌ It was "+esc(y.correct)}. Come back tomorrow for a new one.</p>`:DLY.options.map((o,i)=>`<button class="btn o" onclick="ans(${i})">${esc(o)}</button>`).join("")}</div><h3 class="sec">Your day on the app</h3>${td.length?td.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.text)}</b><div class="jb">${new Date(x.created).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div></div></div>`).join(""):'<p class="sub">Nothing yet today. Visit a spot, match with someone or answer the daily question.</p>'}<h3 class="sec">Questions &amp; answers</h3>${qa.length?qa.map(x=>`<div class="row"><div><b>${esc(x.q)}</b><div class="jb">${esc(x.by)}: ${esc(x.a)}${x.r!==undefined?(x.ok?" · ✅ Correct":" · ❌ It was "+esc(x.r)):""}</div></div></div>`).join(""):'<p class="sub">Your answers will show up here.</p>'}<button class="btn" onclick="pick(${d[3]})">Go to today's spot: ${SCN[d[3]][0]}</button>`}
async function ans(i){try{const r=await api("POST","/daily/answer",{option:i});toast(r.ok?"Correct! 🎉":"Not quite. It's "+r.correct)}catch(e){toast(e.message)}await loadDaily()}
// ---------- my profile ----------
function prof(){if(!me)return gate("see your profile");const ints=me.interests||[],look=me.look||[];
return `<div class="pr"><div class="avw">${av(me,104)}<button class="edb" onclick="designer('edit')" aria-label="Edit bitmoji">${ic(IC.pen)}</button></div><h2>@${esc(me.username)}</h2><div class="jb">${esc(me.area||"Lagos")}</div></div><div class="grid st"><div class="card"><b>${M.matches.length}</b><span>matches</span></div><div class="card"><b>${M.incoming.length}</b><span>requests</span></div></div><div class="card"><b>📸 Profile picture</b><p class="note" style="text-align:left">Only visible to a match after you've exchanged 100 messages.</p><div class="phr"><span class="php">${me.photo?`<img src="${me.photo}">`:"📷"}</span><button class="btn o phb" onclick="$('#ppf').click()">${me.photo?"Change":"Upload"}</button>${me.photo?'<button class="btn o phb" onclick="delPh()">Remove</button>':""}<input id="ppf" type="file" accept="image/*" hidden onchange="uPh(this)"></div></div><button class="btn o" onclick="designer('edit')">🎨 Edit my bitmoji</button><h3 class="sec">About you</h3><label>Username</label><input id="pu" maxlength="20" value="${esc(me.username)}" autocapitalize="none"><label>Bio</label><textarea id="pb" rows="3" maxlength="160" placeholder="Tell people a little about you…">${esc(me.bio||"")}</textarea><label>Area in Lagos</label><select id="pa"><option value="">Choose your area</option>${AREAS.map(a=>`<option ${me.area===a?"selected":""}>${a}</option>`).join("")}</select><label>Favourite spot</label><select id="pf"><option value="">Choose a spot</option>${SCN.map(s=>`<option ${me.fav===s[0]?"selected":""}>${s[0]}</option>`).join("")}</select><label>Looking for</label><div class="gcs">${LOOK.map(x=>`<button class="gc ${look.includes(x)?"on":""}" onclick="tgL(this,'${x}')">${x}</button>`).join("")}</div><label>Interests <span class="op">(pick up to 5, they boost your match %)</span></label><div class="gcs">${IL.map(x=>`<button class="gc ${ints.includes(x)?"on":""}" onclick="tgI(this,'${x}')">${x}</button>`).join("")}</div><div id="pe" class="er"></div><button class="btn" onclick="saveP()">Save profile</button><button class="btn o" onclick="logout()">Log out</button>`}
function tgI(b,x){const a=me.interests=me.interests||[],i=a.indexOf(x);if(i>=0)a.splice(i,1);else if(a.length>=5)return toast("Up to 5 interests");else a.push(x);b.classList.toggle("on");api("PUT","/me",{interests:a}).catch(()=>{})}
function tgL(b,x){const a=me.look=me.look||[],i=a.indexOf(x);if(i>=0)a.splice(i,1);else a.push(x);b.classList.toggle("on");api("PUT","/me",{look:a}).catch(()=>{})}
async function saveP(){try{me=await api("PUT","/me",{username:$("#pu").value.trim().toLowerCase(),bio:$("#pb").value.trim(),area:$("#pa").value,fav:$("#pf").value});toast("Profile saved ✅");render(1)}catch(e){$("#pe").textContent=e.message}}
function readPh(f,cb){if(!f)return;if(!/^image\//.test(f.type))return toast("Please choose an image");const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,256/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};i.src=r.result};r.readAsDataURL(f)}
function sPh(el){readPh(el.files[0],d=>{phd=d;$("#php").innerHTML=`<img src="${d}">`})}
function uPh(el){readPh(el.files[0],async d=>{try{me=await api("PUT","/me",{photo:d});render(1);toast("Photo saved ✅")}catch(e){toast(e.message)}})}
async function delPh(){try{me=await api("PUT","/me",{photo:""});render(1)}catch(e){toast(e.message)}}
async function logout(silent){if(!silent){try{await api("POST","/presence",{loc:-1})}catch(e){}}setTok("");me=null;M={incoming:[],matches:[],sent:[]};PEO=[];PREV=null;MINIT=0;LOW={};DECL={};POPPED={};PH={};tab="home";cur=null;render();if(!silent)toast("Logged out")}
// ---------- sign up / log in / bitmoji designer ----------
const SKT=["#f2c9a0","#c08a62","#a8714f","#8d5a3b","#7a4a30","#5a3622"],HCT=["#2b1d24","#5a3622","#c9a227","#d6407a","#4a5fb0","#9aa0a6"],SHT=["#dc5f84","#4b7a5d","#d79a46","#8f74b8","#2f9aa8","#3d6fb0","#e07a3f","#2b2b3a"],BGT=["#f6e3e8","#d6e3d3","#f3dfb8","#e4d6f0","#cdeaee","#d7dcf3"],HSS=["Short","Long","Afro","Bun","Cap"],ACN=["None","Glasses","Earrings","Headband"],MON=["😊 Smile","😁 Grin","😎 Cool"];
const swt=(k,a)=>`<div class="sws">${a.map(v=>`<button class="sw ${tav[k]===v?"on":""}" style="background:${v}" onclick="setAv('${k}','${v}')"></button>`).join("")}</div>`,cht=(k,a)=>`<div class="gcs">${a.map((t,i)=>`<button class="gc ${tav[k]===i?"on":""}" onclick="setAv('${k}',${i})">${t}</button>`).join("")}</div>`;
const avOpts=()=>`<label>Skin tone</label>${swt("sk",SKT)}<label>Hair style</label>${cht("hs",HSS)}<label>Hair colour</label>${swt("hc",HCT)}<label>Outfit</label>${swt("sh",SHT)}<label>Background</label>${swt("bg",BGT)}<label>Extras</label>${cht("ac",ACN)}<label>Face</label>${cht("mo",MON)}`;
function setAv(k,v){tav[k]=v;$("#avp").innerHTML=AV(tav,130);$("#avo").innerHTML=avOpts()}
function designer(mode){dmode=mode;tav={...avOf(mode==="edit"?me:{})};tav.hs??=tav.g==="F"?1:0;tav.hc??="#2b1d24";tav.ac??=0;tav.mo??=0;
modal(`<button class="x" onclick="closeM()" aria-label="Close">${ic(IC.x)}</button><h2 class="at">Design your bitmoji</h2><p class="sub as">Make it look like you. You can change it any time from your profile.</p><div id="avp" class="avp">${AV(tav,130)}</div><div id="avo">${avOpts()}</div><button class="btn" onclick="finishAv()">${mode==="edit"?"Save bitmoji":"Create my account"}</button>`,"auth")}
function done(){closeM();toast("Welcome, "+me.name);render();presence();loadMatches();loadPeople();const a=after;after=null;if(a)bio(a)}
async function finishAv(){const {g,...av2}=tav;if(dmode==="edit"){try{me=await api("PUT","/me",{avatar:av2});closeM();render(1);toast("Bitmoji saved ✅")}catch(e){toast(e.message)}return}
try{const r=await api("POST","/signup",{username:dr.un,age:dr.age,email:dr.email,password:dr.pw,bio:dr.bio,photo:dr.photo,avatar:av2});setTok(r.token);me=r.user;done()}catch(e){toast(e.message)}}
function eye(){const i=$("#ap");i.type=i.type==="password"?"text":"password"}
async function chkU(){const u=$("#au").value.trim().toLowerCase();if(!u){$("#er").textContent="";return}try{const r=await api("GET","/username?u="+encodeURIComponent(u));$("#er").textContent=r.available?"":"That username is taken, or not allowed (use 3-20 letters, numbers, _ or .)."}catch(e){}}
function openAuth(m,a){after=a||null;phd="";const up=m==="up";modal(`<button class="x" onclick="closeM()" aria-label="Close">${ic(IC.x)}</button><div class="ai">${ic(IC.h,1)}</div><h2 class="at">${up?"Your Lagos story starts here.":"Welcome back."}</h2><p class="sub as">${up?"Tell us a little about the person behind the profile.":"Log in to pick up where you left off."}</p>${up?'<div class="r2"><div><label>Username</label><input id="au" maxlength="20" placeholder="Pick a username" autocapitalize="none" autocomplete="username" onblur="chkU()"></div><div><label>Age</label><input id="ag" type="number" min="18" max="99" inputmode="numeric" placeholder="18+"></div></div>':""}<label>Email address</label><input id="ae" type="email" placeholder="you@example.com" autocomplete="email"><label>Password</label><div class="pw"><input id="ap" type="password" placeholder="${up?"At least 8 characters":"Your password"}" autocomplete="${up?"new-password":"current-password"}"><button type="button" onclick="eye()" aria-label="Show password">${ic(IC.eye)}</button></div>${up?`<label>A little about you <span class="op">(optional)</span></label><textarea id="ab2" rows="3" maxlength="160" placeholder="Your interests, your vibe, what brings you here…"></textarea><label>Profile picture <span class="op">(optional)</span></label><div class="phr"><span id="php" class="php">📷</span><button type="button" class="btn o phb" onclick="$('#phf').click()">Choose photo</button><input id="phf" type="file" accept="image/*" hidden onchange="sPh(this)"></div><p class="note" style="text-align:left">Only visible to others after you exchange 100 messages. Until then everyone sees your bitmoji.</p><p class="note">Adults 18+ only. Next, you'll design your bitmoji.</p>`:""}<div id="er" class="er"></div><button class="btn" onclick="auth('${m}')">${up?"Next: design my bitmoji":"Log in"}</button><button class="lnk" onclick="openAuth('${up?"in":"up"}',after)">${up?"Already have an account? Log in":"New here? Create account"}</button>`,"auth")}
async function auth(m){const er=t=>{$("#er").textContent=t},e=$("#ae").value.trim().toLowerCase(),pw=$("#ap").value;
if(m==="up"){const ag=+$("#ag").value,un=$("#au").value.trim().toLowerCase();if(!/^[a-z0-9_.]{3,20}$/.test(un))return er("Username: 3-20 letters, numbers, _ or .");if(!(ag>=18))return er("You must be 18 or older to join.");if(!/^\S+@\S+\.\S+$/.test(e))return er("Enter a valid email address.");if(pw.length<8)return er("Password must be at least 8 characters.");
try{const r=await api("GET","/username?u="+encodeURIComponent(un));if(!r.available)return er("That username is already taken.")}catch(x){return er(x.message)}
dr={un,age:ag,email:e,pw,bio:$("#ab2").value.trim(),photo:phd};return designer("new")}
try{const r=await api("POST","/login",{email:e,password:pw});setTok(r.token);me=r.user;done()}catch(x){er(x.message)}}
// ---------- start ----------
function tick(){if(!me)return;T++;if(T%7===0)presence();if(tab==="home")loadPeople();if(T%2===0)loadMatches();if(tab==="chat"&&cur)loadThread();if(tab==="corner"&&T%3===0)loadVisitors()}
async function boot(){if(TOK){try{me=await api("GET","/me")}catch(e){setTok("")}}render();if(me){presence();loadMatches();loadPeople()}setInterval(tick,3000)}
boot();
</script>
